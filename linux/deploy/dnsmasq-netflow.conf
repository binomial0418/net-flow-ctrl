# net-flow-ctrl: DHCP for the TV-side network (ens19).
# DNS is served by netflow.service (the YouTube-aware proxy), so dnsmasq's own
# DNS is switched off and clients are pointed at 192.168.50.1.
port=0
interface=ens19
bind-interfaces
dhcp-authoritative
dhcp-range=192.168.50.100,192.168.50.199,255.255.255.0,12h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
