#!/usr/sbin/nft -f
# net-flow-ctrl router VM.
#
# This file lays out the structure and boots fail-closed: until netflow.service
# has registered a device, the "unknown" chain refuses it. The daemon owns the
# contents of the known/blocked/ytblock/ytvideo sets and of the "unknown" and
# "encdns" chains, and rewrites them as rules change.
flush ruleset

define WAN = "ens18"
define LAN = "ens19"
define LAN_NET = 192.168.50.0/24

table inet netflow {
	set known   { type ether_addr; }  # registered devices
	set blocked { type ether_addr; }  # cut off from the uplink entirely
	set ytblock { type ether_addr; }  # cut off from YouTube only

	# googlevideo.com addresses learned from DNS answers: YouTube video traffic
	# is timed (and, under a YouTube block, refused) by destination.
	set ytvideo { type ipv4_addr; flags timeout; timeout 6h; }

	# Public resolvers that answer DNS-over-HTTPS on their own IP.
	set dohips {
		type ipv4_addr
		elements = { 8.8.8.8, 8.8.4.4, 1.1.1.1, 1.0.0.1, 9.9.9.9, 149.112.112.112,
			     208.67.222.222, 208.67.220.220, 94.140.14.14, 94.140.15.15,
			     185.228.168.9, 104.16.248.249, 104.16.249.249, 162.159.61.4,
			     172.64.41.4 }
	}

	# Per-client byte counters, read by the daemon once a second.
	set acct_up      { type ipv4_addr; size 1024; flags dynamic; counter; }
	set acct_down    { type ipv4_addr; size 1024; flags dynamic; counter; }
	set acct_yt_up   { type ipv4_addr; size 1024; flags dynamic; counter; }
	set acct_yt_down { type ipv4_addr; size 1024; flags dynamic; counter; }

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		iifname $WAN accept  # home LAN is trusted: SSH, the portal
		# DHCP, DNS (the proxy) and the portal stay reachable for a blocked
		# device, so it can still see why it is offline.
		iifname $LAN udp dport { 53, 67 } accept
		iifname $LAN tcp dport { 53, 80 } accept
		iifname $LAN icmp type echo-request accept
	}

	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		# Every lookup goes through the local DNS proxy, even one sent to a
		# hard-coded resolver such as Google TV's 8.8.8.8.
		iifname $LAN meta l4proto { tcp, udp } th dport 53 redirect to :53
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		oifname $LAN jump to_lan
		iifname $LAN jump from_lan
	}

	# Uplink -> client. Counted, then only replies are let in: the home LAN
	# cannot open connections into the TV network.
	chain to_lan {
		update @acct_down { ip daddr }
		ip saddr @ytvideo update @acct_yt_down { ip daddr }
		ct state established,related accept
	}

	# Client -> uplink (the internet and the home LAN alike, NAS included).
	chain from_lan {
		ip saddr != $LAN_NET drop
		ether saddr @blocked jump refuse
		ether saddr != @known jump unknown
		jump encdns
		ether saddr @ytblock ip daddr @ytvideo jump refuse
		update @acct_up { ip saddr }
		ip daddr @ytvideo update @acct_yt_up { ip saddr }
		oifname $WAN accept
	}

	# Refuse rather than drop: a silent drop leaves the client waiting out a
	# timeout, a refusal makes it give up (or fall back) at once.
	chain refuse {
		meta l4proto tcp reject with tcp reset
		reject with icmpx admin-prohibited
	}

	chain unknown {
		jump refuse
	}

	chain encdns {
		meta l4proto { tcp, udp } th dport 853 jump refuse
		ip daddr @dohips meta l4proto { tcp, udp } th dport 443 jump refuse
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname $WAN ip saddr $LAN_NET masquerade
	}
}
